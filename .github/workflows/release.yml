name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check pet.mjs
      - name: Generate release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          RANGE=""
          [ -n "$PREV" ] && RANGE="$PREV..HEAD"
          {
            echo "## What's new"
            echo
            git log $RANGE --oneline --no-decorate
            echo
            echo "---"
            echo "Run it: download \`pet.mjs\` below, then \`node pet.mjs\` (Node >= 18)."
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            pet.mjs
            README.md
            README.zh-CN.md
